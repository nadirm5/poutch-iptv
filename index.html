<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY TV Corrigé</title>
<style>
body { font-family: Arial; background:#0A0A1A; color:#fff; }
input, button { padding:10px; margin:5px; width:100%; }
.channel { padding:10px; background:#1a1a2a; margin:5px 0; cursor:pointer; }
</style>
</head>
<body><h2>📺 SKY TV</h2><input id="server" placeholder="Serveur">
<input id="user" placeholder="User">
<input id="pass" placeholder="Password">
<button onclick="connect()">Connexion</button><div id="list"></div><video id="video" controls style="width:100%; margin-top:10px"></video>

<script>
let proxy = "https://api.allorigins.win/raw?url=";

async function connect(){
  const server = document.getElementById('server').value.replace(/\/$/, '');
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;
  const list = document.getElementById('list');

  if(!server || !user || !pass){
    list.innerHTML = "❌ Remplis tout";
    return;
  }

  list.innerHTML = "⏳ Chargement...";

  try{
    const url = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
    const res = await fetch(proxy + encodeURIComponent(url));
    const data = await res.json();

    if(!Array.isArray(data)) throw new Error("Pas de chaînes");

    list.innerHTML = "";

    data.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.innerText = ch.name;
      div.onclick = () => play(`${server}/live/${user}/${pass}/${ch.stream_id}.ts`);
      list.appendChild(div);
    });

  }catch(e){
    list.innerHTML = "❌ Erreur : " + e.message;
  }
}

function play(url){
  const video = document.getElementById('video');
  video.src = url;
  video.play();
}
</script></body>
</html>
