<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SKY TV Player</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:Arial; }
video { width:100%; height:250px; background:black; }
#channels { height:calc(100vh - 250px); overflow-y:auto; background:#111; }
.channel { padding:12px; border-bottom:1px solid #222; cursor:pointer; }
.channel:hover { background:#222; }
</style>
</head>
<body>

<h2 style="text-align:center;">📺 SKY TV Player</h2>
<video id="video" controls autoplay></video>
<div id="channels"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// Récupération des chaînes depuis l'API PHP
fetch("api.php")
.then(res => res.json())
.then(data => {
    let container = document.getElementById("channels");
    data.forEach(ch => {
        let div = document.createElement("div");
        div.className = "channel";
        div.innerText = ch.name;

        div.onclick = () => {
            let video = document.getElementById('video');
            if(Hls.isSupported()) {
                let hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
            } else {
                video.src = ch.url;
            }
        };

        container.appendChild(div);
    });
})
.catch(err => console.log("Erreur API :", err));
</script>

</body>
</html>
