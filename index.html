<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SKY TV | IPTV Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0A0A1A; color: white; }
        .header { background: linear-gradient(135deg, #0A0A2A, #0F0F3A); padding: 25px; text-align: center; }
        .logo { font-size: 36px; font-weight: 800; color: #00BFFF; }
        .sub { font-size: 10px; color: #888; }
        .tabs { display: flex; background: #111; padding: 12px; gap: 8px; }
        .tab { flex: 1; text-align: center; padding: 12px; border-radius: 30px; font-weight: bold; cursor: pointer; color: #888; background: #1a1a2a; }
        .tab.active { background: linear-gradient(135deg, #00BFFF, #1E90FF); color: white; }
        .login-card { margin: 20px; padding: 25px; background: #0F0F2A; border-radius: 25px; }
        input { width: 100%; padding: 14px; margin: 8px 0; background: #1a1a2a; border: 1px solid #2a2a3a; border-radius: 12px; color: white; }
        .mode-switch { display: flex; gap: 10px; margin: 15px 0; }
        .mode-btn { flex: 1; padding: 12px; text-align: center; background: #1a1a2a; border-radius: 30px; cursor: pointer; }
        .mode-btn.active { background: #00BFFF; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #00BFFF, #1E90FF); border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }
        .channels-area { padding: 15px; max-height: 55vh; overflow-y: auto; }
        .channel-card { background: #1a1a2a; padding: 12px; margin: 5px 0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .channel-card:active { background: #00BFFF; }
        .player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .player-modal.active { display: flex; }
        .player-header { padding: 15px; background: #111; display: flex; justify-content: space-between; }
        .close-player { font-size: 24px; cursor: pointer; }
        video { width: 100%; flex: 1; }
        .loading { text-align: center; padding: 40px; color: #00BFFF; }
        .error { text-align: center; padding: 30px; color: #FF4757; background: rgba(255,71,87,0.1); border-radius: 20px; margin: 15px; }
        .info { text-align: center; padding: 20px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☁️ SKY TV</div>
        <div class="sub">PREMIUM IPTV EXPERIENCE</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('channels')">📺 CHAÎNES</div>
        <div class="tab" onclick="switchTab('movies')">🎬 FILMS</div>
        <div class="tab" onclick="switchTab('favorites')">⭐ FAVORIS</div>
    </div>

    <div id="loginCard" class="login-card">
        <div class="info">📡 Entrez votre lien M3U complet</div>
        <input type="text" id="m3uUrl" placeholder="Lien M3U complet">
        <div class="info">📋 Exemple: http://serveur:8080/get.php?username=xxx&password=xxx&type=m3u_plus</div>
        <button onclick="connect()">🔌 SE CONNECTER</button>
    </div>

    <div id="channelsList" class="channels-area">
        <div class="loading">✨ Entrez votre lien M3U</div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span id="playerTitle">SKY TV Player</span>
            <span class="close-player" onclick="closePlayer()">✕</span>
        </div>
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        let channels = [], favorites = JSON.parse(localStorage.getItem('skytv_fav') || '[]');
        let currentTab = 'channels';

        // Liste des proxies CORS (plusieurs pour plus de chances)
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://proxy.cors.sh/',
            'https://cors-anywhere.herokuapp.com/'
        ];

        async function fetchWithProxy(url) {
            for (let proxy of PROXIES) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    const response = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        const text = await response.text();
                        return text;
                    }
                } catch(e) {
                    console.log(`Proxy ${proxy} failed:`, e.message);
                    continue;
                }
            }
            throw new Error('Tous les proxies ont échoué');
        }

        async function connect() {
            const listDiv = document.getElementById('channelsList');
            const m3uUrl = document.getElementById('m3uUrl').value;
            
            if (!m3uUrl) {
                listDiv.innerHTML = '<div class="error">❌ Entrez un lien M3U valide</div>';
                return;
            }
            
            listDiv.innerHTML = '<div class="loading">🔄 Connexion à SKY TV...</div>';
            
            try {
                // Télécharger le fichier M3U
                const content = await fetchWithProxy(m3uUrl);
                
                if (!content || !content.startsWith('#EXTM3U')) {
                    throw new Error('Le lien ne semble pas être une playlist M3U valide');
                }
                
                // Parser le M3U
                channels = [];
                const lines = content.split('\n');
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        // Extraire le nom de la chaîne
                        let name = line.split(',')[1] || 'Chaîne sans nom';
                        
                        // Nettoyer le nom
                        name = name.replace(/[<>]/g, '').trim();
                        
                        // Récupérer l'URL (ligne suivante)
                        let url = lines[i + 1] ? lines[i + 1].trim() : '';
                        
                        // Vérifier que l'URL est valide
                        if (url && (url.startsWith('http') || url.startsWith('https'))) {
                            channels.push({
                                name: name,
                                url: url,
                                group: 'Général'
                            });
                        }
                    }
                }
                
                if (channels.length === 0) {
                    throw new Error('Aucune chaîne trouvée dans la playlist');
                }
                
                // Succès
                document.getElementById('loginCard').style.display = 'none';
                localStorage.setItem('skytv_m3u', m3uUrl);
                displayChannels();
                
            } catch(e) {
                listDiv.innerHTML = `<div class="error">❌ ${e.message}<br><br>💡 Vérifiez que votre lien M3U est correct et que votre abonnement est actif.</div>`;
                console.error(e);
            }
        }

        function displayChannels() {
            let html = `<div class="info">📺 ${channels.length} chaînes chargées</div>`;
            
            channels.forEach(ch => {
                html += `<div class="channel-card" onclick="playChannel('${ch.url.replace(/'/g, "\\'")}')">
                    <span>📺</span>
                    <span>${ch.name}</span>
                </div>`;
            });
            
            document.getElementById('channelsList').innerHTML = html;
        }

        function playChannel(url) {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');
            document.getElementById('playerTitle').innerText = 'Lecture en cours';
            video.src = url;
            video.play();
            modal.classList.add('active');
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            document.getElementById('playerModal').classList.remove('active');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            if (tab === 'channels') displayChannels();
            else if (tab === 'favorites') displayFavorites();
        }
        
        function displayFavorites() {
            const favChannels = channels.filter(ch => favorites.includes(ch.name));
            let html = `<div class="info">⭐ ${favChannels.length} favoris</div>`;
            favChannels.forEach(ch => {
                html += `<div class="channel-card" onclick="playChannel('${ch.url.replace(/'/g, "\\'")}')">
                    <span>⭐</span>
                    <span>${ch.name}</span>
                </div>`;
            });
            document.getElementById('channelsList').innerHTML = html || '<div class="loading">📭 Aucun favori</div>';
        }
        
        // Chargement auto
        const savedM3U = localStorage.getItem('skytv_m3u');
        if (savedM3U) {
            document.getElementById('m3uUrl').value = savedM3U;
            connect();
        }
    </script>
</body>
</html>
