<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Poutch IPTV - Lecteur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .url-input-section {
            padding: 15px;
            background: #1a1a1a;
        }
        .url-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #2a2a2a;
            color: white;
            font-size: 14px;
            text-align: center;
        }
        .url-input::placeholder {
            color: #888;
        }
        .controls {
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-load {
            background: #667eea;
            color: white;
        }
        .btn-play {
            background: #10b981;
            color: white;
        }
        .btn-stop {
            background: #ef4444;
            color: white;
        }
        .player-container {
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 45vh;
            background: #000;
        }
        .channels {
            padding: 15px;
            max-height: 45vh;
            overflow-y: auto;
        }
        .channel-group {
            margin-bottom: 15px;
        }
        .group-title {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #667eea;
        }
        .channel-item {
            background: #1a1a1a;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:active {
            background: #2a2a2a;
        }
        .channel-name {
            font-size: 14px;
            flex: 1;
        }
        .channel-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            background: #2a2a2a;
            border-radius: 5px;
        }
        .info {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 12px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        .current-channel {
            background: #2a2a2a;
            padding: 8px 15px;
            text-align: center;
            font-size: 12px;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📺 Poutch IPTV</h1>
        <p>Lecteur IPTV gratuit</p>
    </div>
    
    <div class="url-input-section">
        <input type="text" id="m3uUrl" class="url-input" placeholder="Collez votre lien M3U ici">
    </div>
    
    <div class="controls">
        <button class="btn-load" onclick="loadPlaylist()">📋 Charger</button>
        <button class="btn-play" onclick="playCurrentChannel()">▶️ Play</button>
        <button class="btn-stop" onclick="stopVideo()">⏹️ Stop</button>
    </div>
    
    <div class="player-container">
        <video id="videoPlayer" controls></video>
    </div>
    
    <div id="currentChannelDisplay" class="current-channel" style="display: none;">
        📺 <span id="currentChannelName"></span>
    </div>
    
    <div id="channelsList" class="channels">
        <div class="info">📡 Collez un lien M3U et cliquez sur "Charger"</div>
    </div>
    
    <div class="info">
        💡 Astuce : Collez votre playlist M3U (lien fourni par votre abonnement)
    </div>

    <script>
        let channels = [];
        let currentChannel = null;
        let videoPlayer = document.getElementById('videoPlayer');
        
        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let info = line.substring(8);
                    let groupMatch = info.match(/group-title="([^"]*)"/);
                    let logoMatch = info.match(/tvg-logo="([^"]*)"/);
                    let name = info.split(',')[1] || 'Chaîne sans nom';
                    
                    let url = lines[i + 1] ? lines[i + 1].trim() : '';
                    
                    if (url && !url.startsWith('#') && url.startsWith('http')) {
                        channels.push({
                            name: name,
                            url: url,
                            group: groupMatch ? groupMatch[1] : 'Général',
                            logo: logoMatch ? logoMatch[1] : ''
                        });
                    }
                }
            }
            return channels;
        }
        
        function displayChannels() {
            const container = document.getElementById('channelsList');
            if (!channels.length) {
                container.innerHTML = '<div class="info">❌ Aucune chaîne trouvée dans la playlist</div>';
                return;
            }
            
            const groups = {};
            channels.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });
            
            let html = '';
            for (let group in groups) {
                html += `<div class="channel-group">`;
                html += `<div class="group-title">📁 ${group}</div>`;
                groups[group].forEach(ch => {
                    html += `
                        <div class="channel-item" onclick="selectChannel('${ch.url.replace(/'/g, "\\'")}', '${ch.name.replace(/'/g, "\\'")}')">
                            <span class="channel-name">📺 ${ch.name}</span>
                            ${ch.logo ? `<img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none'">` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }
        
        function selectChannel(url, name) {
            currentChannel = { url, name };
            videoPlayer.src = url;
            videoPlayer.play();
            
            document.getElementById('currentChannelDisplay').style.display = 'block';
            document.getElementById('currentChannelName').innerText = name;
        }
        
        function playCurrentChannel() {
            if (currentChannel) {
                videoPlayer.src = currentChannel.url;
                videoPlayer.play();
            } else {
                alert('📺 Sélectionnez d\'abord une chaîne');
            }
        }
        
        function stopVideo() {
            videoPlayer.pause();
            videoPlayer.src = '';
        }
        
        async function loadPlaylist() {
            const m3uUrl = document.getElementById('m3uUrl').value;
            if (!m3uUrl) {
                alert('📡 Veuillez coller un lien M3U');
                return;
            }
            
            document.getElementById('channelsList').innerHTML = '<div class="loading">🔄 Chargement de la playlist...</div>';
            
            try {
                const response = await fetch(m3uUrl);
                const content = await response.text();
                channels = parseM3U(content);
                displayChannels();
                
                if (channels.length > 0) {
                    document.getElementById('channelsList').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('channelsList').innerHTML = '<div class="info">❌ Erreur de chargement. Vérifiez le lien M3U</div>';
            }
        }
        
        // Sauvegarder le dernier lien utilisé
        document.getElementById('m3uUrl').addEventListener('blur', function() {
            localStorage.setItem('lastM3U', this.value);
        });
        
        // Charger le dernier lien sauvegardé
        const lastM3U = localStorage.getItem('lastM3U');
        if (lastM3U) {
            document.getElementById('m3uUrl').value = lastM3U;
        }
    </script>
</body>
</html>
