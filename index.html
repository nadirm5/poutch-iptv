<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SKY TV - IPTV Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #001f3f, #0a2a4a);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #00BFFF;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
        }
        input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
        }
        button {
            background: linear-gradient(135deg, #00BFFF, #0066cc);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #1a1a1a;
            border-radius: 25px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #00BFFF;
        }
        .channel {
            background: #1a1a1a;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .channel:active {
            background: #00BFFF;
        }
        video {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            background: black;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #00BFFF;
        }
        .error {
            text-align: center;
            padding: 20px;
            color: #ff4757;
            background: rgba(255,71,87,0.1);
            border-radius: 10px;
        }
        .category {
            font-weight: bold;
            padding: 10px;
            background: #0a2a4a;
            margin: 10px 0 5px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☁️ SKY TV</div>
        <div>Lecteur IPTV Professionnel</div>
    </div>

    <div class="mode-selector">
        <div class="mode-btn active" onclick="setMode('xtream')">🔑 XTREAM</div>
        <div class="mode-btn" onclick="setMode('m3u')">📄 M3U</div>
    </div>

    <div id="xtreamPanel">
        <input type="text" id="serverUrl" placeholder="URL du serveur (ex: http://ip:8080)">
        <input type="text" id="username" placeholder="Nom d'utilisateur">
        <input type="password" id="password" placeholder="Mot de passe">
    </div>

    <div id="m3uPanel" style="display: none;">
        <input type="text" id="m3uUrl" placeholder="Lien M3U (playlist)">
    </div>

    <button onclick="connect()">🔌 SE CONNECTER</button>

    <div id="content"></div>
    <video id="player" controls></video>

    <script>
        let currentMode = 'xtream';
        const API_URL = 'https://skytv-proxy.onrender.com/'; // VOTRE URL RENDER
        
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'xtream') {
                document.getElementById('xtreamPanel').style.display = 'block';
                document.getElementById('m3uPanel').style.display = 'none';
            } else {
                document.getElementById('xtreamPanel').style.display = 'none';
                document.getElementById('m3uPanel').style.display = 'block';
            }
        }
        
        async function connect() {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">🔄 Connexion...</div>';
            
            try {
                let url = API_URL + '?';
                
                if (currentMode === 'xtream') {
                    const server = document.getElementById('serverUrl').value;
                    const user = document.getElementById('username').value;
                    const pass = document.getElementById('password').value;
                    
                    if (!server || !user || !pass) throw new Error('Remplissez tous les champs');
                    
                    url += `server=${encodeURIComponent(server)}&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
                } else {
                    const m3u = document.getElementById('m3uUrl').value;
                    if (!m3u) throw new Error('Entrez un lien M3U');
                    
                    url += `m3u=${encodeURIComponent(m3u)}`;
                }
                
                const response = await fetch(url);
                const channels = await response.json();
                
                if (channels.error) throw new Error(channels.error);
                if (!channels.length) throw new Error('Aucune chaîne trouvée');
                
                // Grouper par catégorie
                const groups = {};
                channels.forEach(ch => {
                    const group = ch.group || 'Général';
                    if (!groups[group]) groups[group] = [];
                    groups[group].push(ch);
                });
                
                let html = '';
                for (let group in groups) {
                    html += `<div class="category">📁 ${group} (${groups[group].length})</div>`;
                    groups[group].forEach(ch => {
                        html += `<div class="channel" onclick="playChannel('${ch.url.replace(/'/g, "\\'")}')">📺 ${ch.name}</div>`;
                    });
                }
                
                contentDiv.innerHTML = html;
                
                // Sauvegarder les identifiants
                if (currentMode === 'xtream') {
                    localStorage.setItem('skytv_server', document.getElementById('serverUrl').value);
                    localStorage.setItem('skytv_user', document.getElementById('username').value);
                } else {
                    localStorage.setItem('skytv_m3u', document.getElementById('m3uUrl').value);
                }
                localStorage.setItem('skytv_mode', currentMode);
                
            } catch(e) {
                contentDiv.innerHTML = `<div class="error">❌ ${e.message}</div>`;
            }
        }
        
        function playChannel(url) {
            const video = document.getElementById('player');
            video.src = url;
            video.play();
        }
        
        // Charger les identifiants sauvegardés
        const savedMode = localStorage.getItem('skytv_mode');
        if (savedMode === 'm3u') {
            setMode('m3u');
            const savedM3u = localStorage.getItem('skytv_m3u');
            if (savedM3u) document.getElementById('m3uUrl').value = savedM3u;
        } else if (savedMode === 'xtream') {
            const savedServer = localStorage.getItem('skytv_server');
            const savedUser = localStorage.getItem('skytv_user');
            if (savedServer && savedUser) {
                document.getElementById('serverUrl').value = savedServer;
                document.getElementById('username').value = savedUser;
            }
        }
    </script>
</body>
</html>
