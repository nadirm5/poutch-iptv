<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NXT IPTV | Ultimate Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        /* Header Premium */
        .premium-header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255,71,87,0.3);
        }

        .logo-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        .app-name {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF4757, #1E90FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .app-slogan {
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            background: #111;
            padding: 12px 15px;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            color: #888;
            background: #1a1a2a;
            transition: all 0.3s;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #FF4757, #1E90FF);
            color: white;
            box-shadow: 0 4px 15px rgba(255,71,87,0.3);
        }

        /* Login Card */
        .login-card {
            margin: 20px;
            padding: 25px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-sub {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .input-premium {
            width: 100%;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid #2a2a3a;
            border-radius: 15px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .input-premium:focus {
            outline: none;
            border-color: #FF4757;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            background: #0a0a0a;
            padding: 5px;
            border-radius: 50px;
        }

        .mode-option {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #888;
        }

        .mode-option.active {
            background: linear-gradient(135deg, #FF4757, #1E90FF);
            color: white;
        }

        .btn-connect {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FF4757, #1E90FF);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Content Area */
        .content-area {
            padding: 15px;
            max-height: 55vh;
            overflow-y: auto;
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255,71,87,0.1);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .category-name {
            font-weight: bold;
            font-size: 14px;
            color: #FF4757;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .channel-card {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .channel-card:active {
            transform: scale(0.96);
            background: #FF4757;
        }

        .channel-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .channel-name {
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Player Modal */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .player-modal.active {
            display: flex;
        }

        .player-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-title {
            font-weight: bold;
            font-size: 14px;
        }

        .player-close {
            width: 36px;
            height: 36px;
            background: rgba(255,71,87,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        video {
            width: 100%;
            flex: 1;
            background: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #FF4757;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #FF4757;
            background: rgba(255,71,87,0.1);
            border-radius: 15px;
            margin: 15px;
        }
    </style>
</head>
<body>

    <div class="premium-header">
        <div class="logo-icon">⚡</div>
        <div class="app-name" id="appName">NXT</div>
        <div class="app-slogan" id="appSlogan">ULTIMATE IPTV EXPERIENCE</div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('channels')">📺 CHAÎNES</div>
        <div class="nav-item" onclick="switchTab('movies')">🎬 FILMS</div>
        <div class="nav-item" onclick="switchTab('series')">📺 SÉRIES</div>
        <div class="nav-item" onclick="switchTab('favorites')">⭐ FAVORIS</div>
    </div>

    <div id="loginCard" class="login-card">
        <div class="login-title">✨ Connexion</div>
        <div class="login-sub">Entrez vos identifiants IPTV</div>
        
        <input type="text" id="serverUrl" class="input-premium" placeholder="URL du serveur (ex: http://ip:8080)">
        <input type="text" id="username" class="input-premium" placeholder="Nom d'utilisateur">
        <input type="password" id="password" class="input-premium" placeholder="Mot de passe">
        
        <div class="mode-selector">
            <div class="mode-option active" onclick="switchMode('xtream')">🔑 XTREAM</div>
            <div class="mode-option" onclick="switchMode('m3u')">📄 M3U</div>
        </div>
        
        <div id="m3uField" style="display: none;">
            <input type="text" id="m3uUrl" class="input-premium" placeholder="Lien M3U">
        </div>
        
        <button class="btn-connect" onclick="connect()">🔌 SE CONNECTER</button>
    </div>

    <div id="contentArea" class="content-area">
        <div class="loading">✨ Entrez vos identifiants</div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span class="player-title" id="playerTitle">Lecture</span>
            <div class="player-close" onclick="closePlayer()">✕</div>
        </div>
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        let channels = [], movies = [], series = [], favorites = JSON.parse(localStorage.getItem('app_fav') || '[]');
        let currentTab = 'channels', currentMode = 'xtream';

        // Configuration du nom - CHANGEZ ICI VOS 3 LETTRES
        const APP_NAME = "NXT";  // ← METTEZ VOS 3 LETTRES ICI
        const APP_SLOGAN = "ULTIMATE IPTV EXPERIENCE";

        document.getElementById('appName').innerText = APP_NAME;
        document.getElementById('appSlogan').innerText = APP_SLOGAN;
        document.title = APP_NAME + " IPTV";

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-option').forEach(opt => opt.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('m3uField').style.display = mode === 'm3u' ? 'block' : 'none';
        }

        async function connect() {
            const contentDiv = document.getElementById('contentArea');
            contentDiv.innerHTML = '<div class="loading">🔄 Connexion...</div>';
            
            try {
                if (currentMode === 'xtream') {
                    const server = document.getElementById('serverUrl').value;
                    const user = document.getElementById('username').value;
                    const pass = document.getElementById('password').value;
                    if (!server || !user || !pass) throw new Error('Remplissez tous les champs');
                    await loadXtream(server, user, pass);
                } else {
                    const m3u = document.getElementById('m3uUrl').value;
                    if (!m3u) throw new Error('Lien M3U requis');
                    await loadM3U(m3u);
                }
                document.getElementById('loginCard').style.display = 'none';
                saveCredentials();
                displayContent();
            } catch(e) {
                contentDiv.innerHTML = `<div class="error">❌ ${e.message}</div>`;
            }
        }

        async function loadXtream(server, user, pass) {
            const proxies = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?'];
            const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}`;
            let data = null;
            
            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy + encodeURIComponent(apiUrl));
                    if (res.ok) { data = await res.json(); break; }
                } catch(e) { continue; }
            }
            
            if (!data) throw new Error('Impossible de se connecter');
            
            channels = data.live?.map(ch => ({
                name: ch.name,
                url: `${server}/live/${user}/${pass}/${ch.stream_id}.ts`,
                group: ch.category_name || 'Général'
            })) || [];
            
            movies = data.vod?.map(m => ({
                name: m.name,
                url: `${server}/movie/${user}/${pass}/${m.stream_id}.mp4`,
                group: m.category_name || 'Films'
            })) || [];
        }

        async function loadM3U(url) {
            const proxies = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?'];
            let content = null;
            
            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy + encodeURIComponent(url));
                    if (res.ok) { content = await res.text(); break; }
                } catch(e) { continue; }
            }
            
            if (!content) throw new Error('Impossible de charger');
            
            channels = [];
            const lines = content.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let name = line.split(',')[1] || 'Sans nom';
                    let streamUrl = lines[i+1]?.trim();
                    if (streamUrl && streamUrl.startsWith('http')) {
                        channels.push({ name: name, url: streamUrl, group: 'Général' });
                    }
                }
            }
        }

        function displayContent() {
            let items = [];
            if (currentTab === 'channels') items = channels;
            else if (currentTab === 'movies') items = movies;
            else if (currentTab === 'favorites') items = [...channels, ...movies].filter(i => favorites.includes(i.name));
            
            const groups = {};
            items.forEach(item => {
                const g = item.group || 'Général';
                if (!groups[g]) groups[g] = [];
                groups[g].push(item);
            });
            
            let html = '';
            for (let g in groups) {
                html += `<div class="category-section">
                    <div class="category-header">
                        <span class="category-name">${g}</span>
                        <span>${groups[g].length}</span>
                    </div>
                    <div class="channels-grid">`;
                groups[g].forEach(item => {
                    const isFav = favorites.includes(item.name);
                    html += `<div class="channel-card" onclick="playItem('${item.url}', '${item.name.replace(/'/g, "\\'")}')">
                        <div class="channel-icon">${isFav ? '⭐' : '📺'}</div>
                        <div class="channel-name">${item.name}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            document.getElementById('contentArea').innerHTML = html || '<div class="loading">📭 Aucun contenu</div>';
        }

        function playItem(url, name) {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('videoPlayer');
            document.getElementById('playerTitle').innerText = name;
            video.src = url;
            video.play();
            modal.classList.add('active');
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            document.getElementById('playerModal').classList.remove('active');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            displayContent();
        }

        function saveCredentials() {
            localStorage.setItem('app_mode', currentMode);
            if (currentMode === 'xtream') {
                localStorage.setItem('app_server', document.getElementById('serverUrl').value);
                localStorage.setItem('app_user', document.getElementById('username').value);
            } else {
                localStorage.setItem('app_m3u', document.getElementById('m3uUrl').value);
            }
        }

        // Auto-load
        const savedMode = localStorage.getItem('app_mode');
        if (savedMode) {
            if (savedMode === 'xtream') {
                const s = localStorage.getItem('app_server');
                const u = localStorage.getItem('app_user');
                if (s && u) {
                    document.getElementById('serverUrl').value = s;
                    document.getElementById('username').value = u;
                    connect();
                }
            } else {
                const m = localStorage.getItem('app_m3u');
                if (m) {
                    document.getElementById('m3uUrl').value = m;
                    connect();
                }
            }
        }
    </script>
</body>
</html>
