<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS TV | IPTV Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4757, #1e90ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Zone URL */
        .url-zone {
            padding: 15px;
            background: #0a0a0a;
        }

        .url-input {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-family: monospace;
        }

        .url-input:focus {
            outline: none;
            border-color: #ff4757;
        }

        /* Boutons */
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-load {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
        }

        .btn-play {
            background: linear-gradient(135deg, #1e90ff, #00b4ff);
            color: white;
        }

        .btn-stop {
            background: #333;
            color: white;
        }

        button:active {
            transform: scale(0.96);
        }

        /* Player */
        .player-area {
            background: #000;
            margin: 10px;
            border-radius: 20px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 40vh;
            background: #000;
        }

        /* Current channel */
        .current {
            background: rgba(255,71,87,0.2);
            margin: 0 10px;
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-name {
            font-size: 14px;
            font-weight: 500;
        }

        .current-badge {
            background: #ff4757;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        /* Search bar */
        .search-box {
            padding: 15px;
            background: #0a0a0a;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }

        /* Channels list */
        .channels-list {
            padding: 10px;
            max-height: 45vh;
            overflow-y: auto;
        }

        .group {
            margin-bottom: 20px;
        }

        .group-title {
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            border-left: 3px solid #ff4757;
        }

        .channel {
            background: #111;
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .channel:active {
            background: #1e1e1e;
            transform: scale(0.98);
        }

        .channel-icon {
            font-size: 20px;
        }

        .channel-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .channel-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            background: #222;
        }

        .info-message {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff4757;
        }

        /* Stats */
        .stats {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #444;
            border-top: 1px solid #111;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ NEXUS TV</div>
        <div class="sub">Ultra Fast IPTV Player</div>
    </div>

    <div class="url-zone">
        <input type="text" id="m3uUrl" class="url-input" placeholder="📡 Collez votre lien M3U ou URL Xtream">
        <div class="buttons">
            <button class="btn-load" onclick="loadPlaylist()">📥 CHARGER</button>
            <button class="btn-play" onclick="playCurrent()">▶️ PLAY</button>
            <button class="btn-stop" onclick="stopVideo()">⏹️ STOP</button>
        </div>
    </div>

    <div class="player-area">
        <video id="videoPlayer" controls></video>
    </div>

    <div id="currentInfo" class="current" style="display: none;">
        <span class="current-name">📺 <span id="currentChannelName">Aucune</span></span>
        <span class="current-badge">EN DIRECT</span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher une chaîne..." onkeyup="searchChannels()">
    </div>

    <div id="channelsList" class="channels-list">
        <div class="info-message">✨ Collez votre playlist M3U et cliquez sur CHARGER</div>
    </div>

    <div class="stats" id="stats"></div>

    <script>
        let channels = [];
        let filteredChannels = [];
        let currentChannel = null;
        let videoPlayer = document.getElementById('videoPlayer');

        function parseM3U(content) {
            const lines = content.split('\n');
            const result = [];
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let info = line.substring(8);
                    let groupMatch = info.match(/group-title="([^"]*)"/);
                    let logoMatch = info.match(/tvg-logo="([^"]*)"/);
                    let name = info.split(',')[1] || 'Sans nom';
                    
                    let url = lines[i + 1] ? lines[i + 1].trim() : '';
                    
                    if (url && (url.startsWith('http') || url.startsWith('https'))) {
                        result.push({
                            name: name,
                            url: url,
                            group: groupMatch ? groupMatch[1] : 'Général',
                            logo: logoMatch ? logoMatch[1] : ''
                        });
                    }
                }
            }
            return result;
        }

        function parseXtream(content, serverUrl, username, password) {
            try {
                const data = JSON.parse(content);
                const result = [];
                
                if (data.channels) {
                    data.channels.forEach(ch => {
                        result.push({
                            name: ch.name,
                            url: `${serverUrl}/live/${username}/${password}/${ch.stream_id}.ts`,
                            group: ch.category_name || 'Général',
                            logo: ch.stream_icon || ''
                        });
                    });
                }
                return result;
            } catch(e) {
                return [];
            }
        }

        function detectUrlType(url) {
            if (url.includes('get.php') && url.includes('username') && url.includes('password')) {
                const urlParams = new URLSearchParams(url.split('?')[1]);
                const serverUrl = url.split('/get.php')[0];
                const username = urlParams.get('username');
                const password = urlParams.get('password');
                return { type: 'xtream', serverUrl, username, password };
            }
            return { type: 'm3u' };
        }

        function displayChannels() {
            const container = document.getElementById('channelsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let channelsToShow = filteredChannels.length ? filteredChannels : channels;
            
            if (searchTerm) {
                channelsToShow = channelsToShow.filter(ch => 
                    ch.name.toLowerCase().includes(searchTerm)
                );
            }
            
            if (!channelsToShow.length) {
                container.innerHTML = '<div class="info-message">📭 Aucune chaîne trouvée</div>';
                document.getElementById('stats').innerHTML = `📊 0 chaîne • ${channels.length} au total`;
                return;
            }
            
            const groups = {};
            channelsToShow.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });
            
            let html = '';
            for (let group in groups) {
                html += `<div class="group">`;
                html += `<div class="group-title">📁 ${group}</div>`;
                groups[group].forEach(ch => {
                    html += `
                        <div class="channel" onclick="selectChannel('${escapeHtml(ch.url)}', '${escapeHtml(ch.name)}')">
                            <span class="channel-icon">📺</span>
                            <span class="channel-name">${escapeHtml(ch.name)}</span>
                            ${ch.logo ? `<img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none'">` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${channelsToShow.length} chaînes • ${Object.keys(groups).length} catégories`;
        }

        function searchChannels() {
            displayChannels();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#39;');
        }

        function selectChannel(url, name) {
            currentChannel = { url, name };
            videoPlayer.src = url;
            videoPlayer.play();
            
            document.getElementById('currentInfo').style.display = 'flex';
            document.getElementById('currentChannelName').innerText = name;
        }

        function playCurrent() {
            if (currentChannel) {
                videoPlayer.src = currentChannel.url;
                videoPlayer.play();
            } else {
                alert('📺 Sélectionnez d\'abord une chaîne');
            }
        }

        function stopVideo() {
            videoPlayer.pause();
            videoPlayer.src = '';
        }

        async function loadPlaylist() {
            const input = document.getElementById('m3uUrl').value;
            if (!input) {
                alert('📡 Collez un lien M3U ou une URL Xtream');
                return;
            }
            
            document.getElementById('channelsList').innerHTML = '<div class="loading">🔄 Chargement en cours...</div>';
            
            try {
                const detection = detectUrlType(input);
                
                let content;
                if (detection.type === 'xtream') {
                    const apiUrl = `${detection.serverUrl}/player_api.php?username=${detection.username}&password=${detection.password}`;
                    const response = await fetch(apiUrl);
                    content = await response.text();
                    channels = parseXtream(content, detection.serverUrl, detection.username, detection.password);
                } else {
                    const response = await fetch(input);
                    content = await response.text();
                    channels = parseM3U(content);
                }
                
                filteredChannels = [...channels];
                displayChannels();
                
                if (channels.length > 0) {
                    localStorage.setItem('lastM3U', input);
                    document.getElementById('channelsList').scrollIntoView({ behavior: 'smooth' });
                } else {
                    document.getElementById('channelsList').innerHTML = '<div class="info-message">⚠️ Aucune chaîne trouvée. Vérifiez votre lien</div>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('channelsList').innerHTML = '<div class="info-message">❌ Erreur de chargement. Vérifiez votre lien et votre connexion</div>';
            }
        }

        // Charger dernier lien utilisé
        const lastM3U = localStorage.getItem('lastM3U');
        if (lastM3U) {
            document.getElementById('m3uUrl').value = lastM3U;
        }
    </script>
</body>
</html>
