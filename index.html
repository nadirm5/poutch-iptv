<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SKY TV - IPTV Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #001f3f, #0a2a4a);
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #00BFFF;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
        }
        button {
            background: linear-gradient(135deg, #00BFFF, #0066cc);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.98);
        }
        .channel {
            background: #1a1a1a;
            padding: 12px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .channel:active {
            background: #00BFFF;
        }
        video {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            background: black;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #00BFFF;
        }
        .error {
            text-align: center;
            padding: 20px;
            color: #ff4757;
            background: rgba(255,71,87,0.1);
            border-radius: 10px;
        }
        .category {
            font-weight: bold;
            padding: 10px;
            background: #0a2a4a;
            margin: 10px 0 5px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☁️ SKY TV</div>
        <div>Lecteur IPTV Professionnel</div>
    </div>

    <input type="text" id="server" placeholder="URL du serveur (ex: http://ip:8080)">
    <input type="text" id="user" placeholder="Nom d'utilisateur">
    <input type="password" id="pass" placeholder="Mot de passe">
    <button onclick="loadChannels()">🔌 SE CONNECTER</button>

    <div id="list"></div>
    <video id="video" controls></video>

    <script>
        const API_URL = 'https://skytv-proxy.onrender.com';
        
        async function loadChannels() {
            const server = document.getElementById('server').value.trim();
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const listDiv = document.getElementById('list');
            
            if (!server || !user || !pass) {
                listDiv.innerHTML = '<div class="error">❌ Remplissez tous les champs</div>';
                return;
            }
            
            listDiv.innerHTML = '<div class="loading">🔄 Connexion à SKY TV...</div>';
            
            try {
                // Nettoyer l'URL du serveur
                const cleanServer = server.replace(/\/$/, '');
                
                const url = `${API_URL}?server=${encodeURIComponent(cleanServer)}&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`;
                console.log("URL appelée:", url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log("Réponse:", data);
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Aucune chaîne trouvée');
                }
                
                // Grouper par catégorie
                const groups = {};
                data.forEach(ch => {
                    const group = ch.group || 'Chaînes';
                    if (!groups[group]) groups[group] = [];
                    groups[group].push(ch);
                });
                
                let html = '';
                for (let group in groups) {
                    html += `<div class="category">📁 ${group} (${groups[group].length})</div>`;
                    groups[group].forEach(ch => {
                        html += `<div class="channel" onclick="playChannel('${ch.url.replace(/'/g, "\\'")}')">📺 ${ch.name}</div>`;
                    });
                }
                
                listDiv.innerHTML = html;
                
                // Sauvegarder les identifiants
                localStorage.setItem('skytv_server', server);
                localStorage.setItem('skytv_user', user);
                localStorage.setItem('skytv_pass', pass);
                
            } catch(e) {
                console.error("Erreur:", e);
                listDiv.innerHTML = `<div class="error">❌ ${e.message}<br><br>💡 Vérifiez vos identifiants</div>`;
            }
        }
        
        function playChannel(url) {
            const video = document.getElementById('video');
            video.src = url;
            video.play();
        }
        
        // Chargement automatique des identifiants sauvegardés
        const savedServer = localStorage.getItem('skytv_server');
        const savedUser = localStorage.getItem('skytv_user');
        const savedPass = localStorage.getItem('skytv_pass');
        
        if (savedServer && savedUser && savedPass) {
            document.getElementById('server').value = savedServer;
            document.getElementById('user').value = savedUser;
            document.getElementById('pass').value = savedPass;
            loadChannels();
        }
    </script>
</body>
</html>
