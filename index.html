<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY TV</title>
    <style>
        body { font-family: Arial; background: #0A0A1A; color: #fff; padding: 20px; }
        .header { text-align: center; padding: 20px; background: linear-gradient(135deg, #0A0A2A, #0F0F3A); border-radius: 20px; margin-bottom: 20px; }
        .logo { font-size: 40px; font-weight: bold; color: #00BFFF; }
        button { padding: 12px; width: 100%; background: linear-gradient(135deg, #00BFFF, #1E90FF); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        .channel { padding: 12px; background: #1a1a2a; margin: 5px 0; border-radius: 10px; cursor: pointer; }
        video { width: 100%; margin-top: 15px; }
        .loading { text-align: center; padding: 20px; color: #00BFFF; }
        .error { text-align: center; padding: 20px; color: #FF4757; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☁️ SKY TV</div>
    </div>

    <button onclick="loadChannels()">📺 CHARGER LES CHAÎNES</button>
    <div id="list"></div>
    <video id="video" controls></video>

    <script>
        const API_URL = "https://skytv-proxy.onrender.com/channels";
        
        async function loadChannels() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '<div class="loading">⏳ Chargement...</div>';
            
            try {
                const response = await fetch(API_URL);
                const channels = await response.json();
                
                if (channels.error) throw new Error(channels.error);
                
                listDiv.innerHTML = '';
                channels.forEach(ch => {
                    const div = document.createElement('div');
                    div.className = 'channel';
                    div.innerText = ch.name;
                    div.onclick = () => {
                        document.getElementById('video').src = ch.stream_url;
                        document.getElementById('video').play();
                    };
                    listDiv.appendChild(div);
                });
            } catch(e) {
                listDiv.innerHTML = `<div class="error">❌ ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
